name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull-request run must never cancel a live main deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies exactly from the lockfile
        run: npm ci

      - name: Stamp the artifact with its exact source revision
        run: |
          mkdir -p public
          printf '{"source_sha":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > public/deployment.json

      - name: Unit tests (Vitest - RFC 5869, FIPS 197, SP 800-38A and both fixed schedules)
        run: npm test

      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # Browsers are installed IN THE JOB rather than baked into a pinned container
  # image, which is what the master template prescribes
  # (`npx playwright install --with-deps chromium`) and what the first CI run
  # here argued for: the image was pinned to v1.64.0-noble while
  # `@playwright/test: ^1.64.0` resolved to 1.65.1, and every browser test
  # failed with "Executable doesn't exist ... Please update docker image as
  # well." Installing from the resolved package can never disagree with it, and
  # it removes a coupling Dependabot cannot see (it bumps the npm range; it does
  # not rewrite a `container.image` digest).
  #
  # Chromium only, because both Playwright projects in playwright.config.ts run
  # on Desktop Chrome: the a11y gate is deliberately single-engine so it is
  # deterministic, and the claims suite asserts what the page SAYS, which does
  # not vary by engine.
  #
  # This job runs BOTH browser suites, and the distinction matters: test:a11y
  # alone would leave the claims suite - which is what checks the page tells the
  # truth, including the negative claim - out of the gate entirely. A 2026-08-14
  # sweep found 29 repos whose deploy job ran the a11y half only.
  #
  # It also runs the mutation ledger, because that is the only job with both
  # runners available. Mutation 11 is a patch to the page whose oracle is the
  # claims suite, so a build job without browsers records it as OWNER-NOT-GREEN
  # rather than as a kill - which is the runner refusing to credit a result it
  # could not obtain, and is exactly what happened on the first run here.
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies exactly from the lockfile
        run: npm ci

      - name: Install the browser the resolved Playwright expects
        run: npx playwright install --with-deps chromium

      - name: Browser gate (axe WCAG A/AA, and the claims suite)
        run: npm run test:e2e:all

      - name: Prove the tests bite (12 mutations, each a concrete patch)
        # Master template 4.1c. A surviving mutation fails this step, so a
        # change that quietly removes a test's teeth cannot reach the site. The
        # runner restores every file it patches and verifies the restoration.
        run: npm run mutate

  deploy:
    needs: [build, browser-gate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify served Pages bytes match the deployed revision
        env:
          LIVE_URL: https://systemslibrarian.github.io/crypto-lab-exposure-notification/
        run: |
          set -eu
          for attempt in $(seq 1 18); do
            result=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}deployment.json?sha=${GITHUB_SHA}" 2>/dev/null || true)
            if node -e 'try { const p=JSON.parse(process.argv[1]);process.exit(p.source_sha===process.argv[2]&&p.repository===process.argv[3]?0:1) } catch { process.exit(1) }' "$result" "$GITHUB_SHA" "$GITHUB_REPOSITORY"; then
              html=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}?sha=${GITHUB_SHA}" 2>/dev/null || true)
              if printf '%s' "$html" | grep -Fq 'id="app"'; then
                echo "Verified live HTML and source revision $GITHUB_SHA at $LIVE_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Live Pages failed source-SHA/HTML verification"
          exit 1

  # Dependabot only. The complete build gate decides whether a bump is safe;
  # this job then merges and explicitly dispatches the main deployment.
  dependabot-auto-merge:
    needs: [build, browser-gate]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: bump
        name: Read the bump type from the pull request itself
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # No third-party action in the merge path, and no API call either: the
        # versions come from the pull request's own text, which the triggering
        # event already carries, judged by an in-repo script that answers
        # major / non-major / unknown. Only non-major merges; unknown waits for a
        # person, which is what a grouped pull request with no versions, a
        # retitled one, or a missing body all come to.
        #
        # The title and body are ATTACKER-CONTROLLED, so they reach the script
        # only through env and are never interpolated into this script. A ${{ }}
        # in a `run:` block is substituted before bash reads the line, so a
        # crafted title would become shell source; an env value is data to bash
        # and never source. This is also why the two API reads are gone rather
        # than merely quoted: the payload already holds the text, so the read
        # cannot fail at all. The hub's tools/dispatch-sync.js greps this job for
        # a PR re-query because one used to guard the dispatch; with the reads
        # removed there is nothing left for it to distrust. Describing the call
        # by name here would re-trigger that grep, which is why this comment
        # does not spell it.
        run: |
          set -eu
          node .github/scripts/bump-type.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Merge any bump whose gate went green
        if: steps.bump.outputs.bump == 'non-major'
        run: |
          set -eu
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts; the bump is unmerged and no deploy was dispatched"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
